<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цирюльня №7</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--hd:#0D141C;--bg:#0D141C;--panel:#16212D;--ink:#F1F3F5;--muted:#8FA0B0;--red:#FF4D5E;--blue:#6C93D6;--line:#243242;
  --head:"Oswald","Arial Narrow",Impact,sans-serif;--body:"Manrope",system-ui,sans-serif}
:root[data-theme="light"]{--bg:#EDF0F3;--panel:#DFE4EA;--ink:#0F1923;--muted:#566471;--red:#D7263D;--blue:#1E3F7A;--line:#C5CCD4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.hd{background:var(--hd);display:flex;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:3px solid var(--red)}
.hd img{display:block;height:92px;width:auto}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 190px}
h1{font:700 1.9rem/1 var(--head);text-transform:uppercase;margin:0 0 14px}
.blk{margin-bottom:22px;transition:opacity .2s}
.blk.lock{opacity:.4;pointer-events:none}
.blk h2{display:flex;align-items:center;gap:10px;font:700 1.1rem var(--head);text-transform:uppercase;letter-spacing:.05em;margin:0 0 10px}
.blk h2 i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font:700 .85rem var(--head);font-style:normal}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:0;border-left:5px solid transparent;padding:12px 14px;margin-bottom:8px}
.row.on{border-left-color:var(--red)}
.row small{display:block;color:var(--muted);font-size:.8rem}
.row b{font:700 1.1rem var(--head);white-space:nowrap}
.mst{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.m{background:none;border:0;padding:0;text-align:center;font-size:.78rem;color:var(--muted)}
.ring{display:block;width:62px;height:62px;margin:0 auto 4px;border-radius:50%;padding:3px;background:var(--line)}
.m.on .ring{background:repeating-linear-gradient(-45deg,var(--red) 0 6px,#fff 6px 12px,var(--blue) 12px 18px,#fff 18px 24px)}
.ring span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--panel);color:var(--ink);font:700 1.5rem var(--head)}
.m.on{color:var(--ink)}
.cal{background:var(--panel);padding:12px}
.cal-h{font:700 1rem var(--head);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;text-align:center}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-g .w{color:var(--muted);font-size:.72rem;padding:2px 0}
.day{display:grid;place-items:center;aspect-ratio:1;border:2px solid transparent;border-radius:50%;background:none;font-weight:700;font-size:.95rem}
button.day{background:var(--bg)}
button.day:active{border-color:var(--red)}
.day.sel{background:var(--red)!important;color:#fff}
.day.out{opacity:.25}.day.full{opacity:.35;text-decoration:line-through}.day.wait{opacity:.6}
.day.today{border-color:var(--blue)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{background:var(--panel);border:2px solid transparent;padding:11px 4px;font-weight:700}
.chip.on{background:var(--red);color:#fff}
.hint{color:var(--muted);font-size:.9rem;margin:0}
.card{background:var(--panel);padding:14px;margin-bottom:10px;display:flex;gap:14px;align-items:center}
.card .ring{margin:0;flex:none}
.card h3{font:700 1.2rem var(--head);text-transform:uppercase;margin:0}
.card p{margin:2px 0 8px;color:var(--muted);font-size:.9rem}
.link{background:none;border:0;padding:0;color:var(--red);font-weight:700}
.info div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.info span{color:var(--muted)}
.foot{margin-top:18px;color:var(--muted);font-size:.8rem}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line)}
.cta{display:flex;align-items:center;gap:12px;max-width:520px;margin:0 auto;padding:10px 16px}
.cta .t{flex:1;font-size:.82rem;line-height:1.3}
.cta .t b{display:block;font:700 1rem var(--head);text-transform:uppercase}
.go{background:var(--red);color:#fff;border:0;padding:13px 18px;font:700 1rem var(--head);text-transform:uppercase;letter-spacing:.06em}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);max-width:520px;margin:0 auto;padding:4px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{background:none;border:0;padding:6px 0;color:var(--muted);font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--red)}
[hidden]{display:none!important}
</style>
</head>

<div class="wrap" id="content"></div>
<div class="dock">
  <div class="cta" id="cta" hidden><div class="t" id="sum"></div><button class="go" data-a="go">Записаться</button></div>

<script>
/*PURE-START*/
var OPEN=600,CLOSE=1260,STEP=30,DAYS=7,LEAD=30;  // как в booking.py: 10:00-21:00, шаг 30 мин, 7 дней, минимум за 30 мин
function pad(n){return String(n).padStart(2,'0')}
function dayCode(d){return ''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())}
function hhmm(t){return pad(Math.floor(t/60))+':'+pad(t%60)}
function code(t){return pad(Math.floor(t/60))+pad(t%60)}
function parseBusy(str){
  if(!str) return [];
  return str.split(',').map(function(p){var a=p.split('.');return {m:+a[0],d:a[1],s:+a[2],e:+a[3]}})
    .filter(function(b){return b.d&&!isNaN(b.s)&&!isNaN(b.e)});
}
function freeSlots(busy,master,dc,duration,now){
  var y=+dc.slice(0,4),mo=+dc.slice(4,6)-1,da=+dc.slice(6,8),res=[];
  for(var t=OPEN;t+duration<=CLOSE;t+=STEP){
    var start=new Date(y,mo,da,0,t);
    if(start.getTime()<now.getTime()+LEAD*60000) continue;
    if(busy.every(function(b){return b.m!==master||b.d!==dc||t+duration<=b.s||t>=b.e})) res.push(t);
  }
  return res;
}
/*PURE-END*/

var tg=window.Telegram&&window.Telegram.WebApp;
var inTg=!!(tg&&tg.platform&&tg.platform!=='unknown');  // у кнопок клавиатуры initData пустой, поэтому смотрим на платформу
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#0D141C')}catch(e){}}
var light=(tg&&tg.colorScheme)?tg.colorScheme==='light':window.matchMedia('(prefers-color-scheme: light)').matches;
document.documentElement.dataset.theme=light?'light':'dark';

var busy=parseBusy(new URLSearchParams(location.search).get('b'));
// Услуги и мастера: те же, что в bot.py. Меняете там, меняйте и здесь.
var S=[["Мужская стрижка",45,1500],["Стрижка машинкой",30,900],["Оформление бороды",30,1000],
       ["Стрижка + борода",75,2200],["Королевское бритьё",45,1400],["Камуфляж седины",40,1200]];
var M=[["Каземир","Старший барбер, 8 лет опыта. Классика и фейды."],["Федя:)","Барбер, 5 лет опыта. Борода и королевское бритьё."],
       ["Серёжа^^","Барбер, 3 года опыта. Современные короткие стрижки."]];
var WD=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"],WDS=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
var MON=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
var TABS=[["book","Запись",'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'],
          ["price","Услуги",'<path d="M3 4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1"/>'],
          ["team","Мастера",'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>'],
          ["info","Контакты",'<path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>']];
var st={tab:'book',s:null,m:-1,d:null,t:null};  // m = -1: любой мастер

function money(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' ₽'}
function dur(m){var h=Math.floor(m/60),r=m%60;return h?(r?h+' ч '+r+' мин':h+' ч'):r+' мин'}
function dayDate(dc){return new Date(+dc.slice(0,4),+dc.slice(4,6)-1,+dc.slice(6,8))}
function dayLabel(dc){var d=dayDate(dc);return WDS[d.getDay()]+' '+dc.slice(6,8)+'.'+dc.slice(4,6)}
function ring(j){return '<span class="ring"><span>'+(j<0?'★':M[j][0].charAt(0))+'</span></span>'}

function slotsFor(m,dc,duration,now){
  if(m>=0) return freeSlots(busy,m,dc,duration,now);
  var set={};
  for(var j=0;j<M.length;j++) freeSlots(busy,j,dc,duration,now).forEach(function(t){set[t]=1});
  return Object.keys(set).map(Number).sort(function(a,b){return a-b});
}
function resolveMaster(m,dc,duration,t,now){
  if(m>=0) return m;
  for(var j=0;j<M.length;j++) if(freeSlots(busy,j,dc,duration,now).indexOf(t)>=0) return j;
  return -1;
}

function block(n,title,body,locked){return '<section class="blk'+(locked?' lock':'')+'"><h2><i>'+n+'</i>'+title+'</h2>'+body+'</section>'}

function calendar(now){
  var t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),today=dayCode(t0);
  var start=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate()-(t0.getDay()+6)%7);
  var last=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate()+DAYS-1);
  var end=new Date(last.getFullYear(),last.getMonth(),last.getDate()+6-(last.getDay()+6)%7);
  var label=MON[t0.getMonth()]+(last.getMonth()!==t0.getMonth()?' – '+MON[last.getMonth()]:'')+' '+last.getFullYear();
  var h='<div class="cal"><div class="cal-h">'+label+'</div><div class="cal-g">'+WD.map(function(w){return '<div class="w">'+w+'</div>'}).join('');
  for(var d=start;d<=end;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)){
    var dc=dayCode(d),inWin=d>=t0&&d<=last,ok=false;
    if(inWin&&st.s!==null) ok=slotsFor(st.m,dc,S[st.s][1],now).length>0;
    var cls='day'+(inWin?'':' out')+(dc===st.d?' sel':'')+(dc===today?' today':'')+(inWin&&st.s===null?' wait':'')+(inWin&&st.s!==null&&!ok?' full':'');
    h+=ok?'<button class="'+cls+'" data-a="day" data-v="'+dc+'">'+d.getDate()+'</button>':'<span class="'+cls+'">'+d.getDate()+'</span>';
  }
  return h+'</div></div>';
}

function bookHtml(){
  var now=new Date(),h='<h1>Запись</h1>';
  h+=block(1,'Услуга',S.map(function(x,i){return '<button class="row'+(st.s===i?' on':'')+'" data-a="svc" data-v="'+i+'"><span>'+x[0]+'<small>'+dur(x[1])+'</small></span><b>'+money(x[2])+'</b></button>'}).join(''));
  var mm='<div class="mst"><button class="m'+(st.m<0?' on':'')+'" data-a="mst" data-v="-1">'+ring(-1)+'Любой</button>'
    +M.map(function(x,j){return '<button class="m'+(st.m===j?' on':'')+'" data-a="mst" data-v="'+j+'">'+ring(j)+x[0]+'</button>'}).join('')+'</div>';
  h+=block(2,'Мастер',mm);
  h+=block(3,'Дата',st.s===null?'<p class="hint">Сначала выберите услугу.</p>'+calendar(now):calendar(now));
  var tb;
  if(st.d===null) tb='<p class="hint">Выберите день в календаре.</p>';
  else{
    var sl=slotsFor(st.m,st.d,S[st.s][1],now);
    tb=sl.length?'<div class="chips">'+sl.map(function(t){return '<button class="chip'+(st.t===t?' on':'')+'" data-a="time" data-v="'+t+'">'+hhmm(t)+'</button>'}).join('')+'</div>'
                :'<p class="hint">На этот день свободного времени нет.</p>';
  }
  h+='<div id="times">'+block(4,'Время',tb,st.d===null)+'</div>';
  return h+'<p class="foot">'+(inTg?'':'Демо-режим вне Telegram: данные никуда не отправляются. ')+'Оплата на месте.</p>';
}
function priceHtml(){
  return '<h1>Услуги</h1>'+S.map(function(x,i){return '<div class="row"><span>'+x[0]+'<small>'+dur(x[1])+'</small><button class="link" data-a="book-svc" data-v="'+i+'">Записаться</button></span><b>'+money(x[2])+'</b></div>'}).join('');
}
function teamHtml(){
  return '<h1>Мастера</h1>'+M.map(function(x,j){return '<div class="card">'+ring(j).replace('class="ring"','class="ring" style="background:repeating-linear-gradient(-45deg,var(--red) 0 6px,#fff 6px 12px,var(--blue) 12px 18px,#fff 18px 24px)"')
    +'<div><h3>'+x[0]+'</h3><p>'+x[1]+'</p><button class="link" data-a="book-mst" data-v="'+j+'">Записаться к мастеру</button></div></div>'}).join('');
}
function infoHtml(){
  return '<h1>Контакты</h1><div class="info"><div><span>Адрес</span><b>ул. Примерная, 7</b></div><div><span>Часы работы</span><b>ежедневно, 10:00–21:00</b></div>'
    +'<div><span>Оплата</span><b>картой или наличными</b></div></div><p class="foot">Демо-проект для портфолио. Салона, адреса и цен не существует.</p>';
}

function render(){
  var c=document.getElementById('content');
  c.innerHTML=st.tab==='book'?bookHtml():st.tab==='price'?priceHtml():st.tab==='team'?teamHtml():infoHtml();
  document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button class="tab'+(st.tab===t[0]?' on':'')+'" data-a="tab" data-v="'+t[0]+'"><svg viewBox="0 0 24 24">'+t[2]+'</svg>'+t[1]+'</button>'}).join('');
  var ready=st.tab==='book'&&st.s!==null&&st.d!==null&&st.t!==null;
  document.getElementById('cta').hidden=!ready;
  if(ready){
    var now=new Date(),m=resolveMaster(st.m,st.d,S[st.s][1],st.t,now);
    document.getElementById('sum').innerHTML='<b>'+S[st.s][0]+', '+money(S[st.s][2])+'</b>'+dayLabel(st.d)+', '+hhmm(st.t)+(m>=0?' · '+M[m][0]:'');
  }
}

function act(a,v){
  if(a==='tab'){st.tab=v;window.scrollTo(0,0)}
  else if(a==='svc'){st.s=+v;st.d=null;st.t=null}
  else if(a==='mst'){st.m=+v;st.d=null;st.t=null}
  else if(a==='day'){st.d=v;st.t=null}
  else if(a==='time'){st.t=+v}
  else if(a==='book-svc'){st.s=+v;st.d=null;st.t=null;st.tab='book';window.scrollTo(0,0)}
  else if(a==='book-mst'){st.m=+v;st.d=null;st.t=null;st.tab='book';window.scrollTo(0,0)}
  else if(a==='go'){return send()}
  render();
  if(a==='day'){var el=document.getElementById('times');if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'center'})}
}
function send(){
  var now=new Date(),m=resolveMaster(st.m,st.d,S[st.s][1],st.t,now);
  var payload=JSON.stringify({s:st.s,m:m,d:st.d,t:code(st.t)});
  if(inTg){tg.sendData(payload)}  // приложение закроется, бот получит данные
  else{document.getElementById('sum').innerHTML='<b>Демо-режим</b>Бот получил бы: '+payload}
}
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v)});
render();
</script>
</body>
</html>
